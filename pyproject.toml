[project]
name = "bank-cs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.2.0",
    "fastapi>=0.162.3",
    "grandalf>=0.8",
    "jieba>=0.42.1",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pandas>=3.1.1",
    "peft==0.18.1",
    "pymilvus>=3.0.3",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "torch==2.11.0",
    "transformers==5.8.0",
    "uvicorn>=0.54.0",
]

# 意图路由模型（Qwen2.5-1.5B + LoRA）在本机 GPU 上推理：Windows / Linux 使用 CUDA 12.8 版 PyTorch
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
