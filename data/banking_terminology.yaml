# 狮城银行 FAQ 业务术语表
# section 是 data/kb 对应文件里 H2 标题的中文部分，可作为预期出处。
# aliases 收录用户可能使用的表达，用于检索与精排对齐。业务权限、工单创建、冻结确认由现有流程决定。
# 多轮先确认指代对象。候选场景仍有歧义时，可以保留多个候选或追问。
# rerank_hint 标记经过验证、可用于精排的条目。cues 中每一组至少命中一个表达。
schema_version: 1
