disambiguation:
  - topic: "ATM 吞卡与未出钞"
    terms: ["atm_retained_card","atm_cash_not_dispensed","atm_withdrawal_fees"]
    guidance: "确认终端留下的是卡、现金未发放但已扣款，还是仅询问费用。单独出现 ATM 或「没吐」时，结合句中的对象判断。"
  - topic: "账单代扣授权与卡片预授权"
    terms: ["egiro_mandate_pending","giro_authorisation","card_preauthorisation_vs_final","pending_vs_posted_card_payment"]
    guidance: "账单机构、自动扣账、授权申请未生效指向 GIRO 类场景。酒店押金、商户暂占额度、最终刷卡金额指向卡片预授权。pending authorisation 独立出现时需要上下文。"
  - topic: "信用卡账单、最低还款与付款入账"
    terms: ["statement_vs_current_balance","minimum_vs_full_payment","repayment_checks","repayment_not_posted","duplicate_card_entry"]
    guidance: "出账后新增的消费对应账单与当前余额差异。只付一部分对应最低还款。钱已经付出但卡方未记账对应还款入账。实际同笔消费显示两次才考虑重复记录。"
  - topic: "单笔回单、对账单与账户证明"
    terms: ["statement_receipt_account_proof","receipt_status_meaning","receipt_evidence_limits","account_proof_requirements"]
    guidance: "问账户持有人或文件能否替代，优先核对文件用途。问收款方是否已收到，看回单的证明边界。问状态字样的解释或正式证明的申领要求，分别对齐对应术语。"
  - topic: "盗刷、商户争议与小额验证"
    terms: ["unrecognised_card_transaction","suspected_card_compromise","verification_charge_unknown_merchant","authorised_transaction_dispute","fraud_vs_merchant_dispute","merchant_refund_not_posted"]
    guidance: "客户明确未授权的交易保留原有安全分流。已知本人消费但金额、退款有争议时看商户争议。单凭商户名称陌生或金额小无法判断是否盗刷。"
  - topic: "转账时效、具体进度与转错人"
    terms: ["general_transfer_timing","submitted_transfer_progress","transfer_failure_reasons","paynow_wrong_recipient","unexpected_paynow_payment"]
    guidance: "通常多久到账是通用时效。昨天那笔等指明具体记录时应保留本人查询和验证要求。已转错人、陌生款项要求退给第三方各有独立处理说明。"
  - topic: "卡片寄送、到期与挂失补卡"
    terms: ["card_delivery","card_expiry","renewal_vs_replacement","lost_stolen_card","replacement_supplementary_card","recurring_payment_after_replacement"]
    guidance: "未到手是配送问题。有效期将至是到期更新。卡找不到是挂失场景。卡换好了但订阅不扣费，应按更换后的自动扣款问题检索。"
  - topic: "登录、卡 PIN、身份验证与换手机号"
    terms: ["forgotten_login_password","card_pin","identity_verification_failed","old_mobile_unavailable","update_personal_details","myinfo_mismatch"]
    guidance: "确认用户指 App 登录密码、实体卡 PIN、身份校验结果，还是绑定手机号收不到验证码。出现验证码、卡密码等词时保留该区分。"
  - topic: "海外刷卡费用与币种选择"
    terms: ["foreign_card_conversion_fees","dcc_sgd_vs_local_currency","foreign_purchase_shown_in_sgd","overseas_cash_vs_card_fees"]
    guidance: "旅途中当场选币种、事后对账单显示 SGD、询问外币附加费和比较取现成本，是不同的问题。"
  - topic: "提交新工单与跟进原工单"
    terms: ["submit_ticket","ticket_status","ticket_followup","fraud_dispute_ticket_status"]
    guidance: "询问入口或状态时保留只读语义。旧单未解决或需要补资料时优先定位原工单，是否创建新工单由现有流程决定。"
